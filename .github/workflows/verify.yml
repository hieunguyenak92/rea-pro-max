name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolkit:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        # Keep CI on the standard Intel pool after ARM capacity cancellations.
        # Local release checks separately cover macOS arm64.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    steps:
      - name: Keep source bytes identical across operating systems
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development tools without Electron runtime download
        run: npm ci --ignore-scripts
      - name: Verify bundled SDK bytes and retained licenses
        run: npm run check:vendor
      - name: Run engine, CLI and real MCP client tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Check documentation and recorded data
        run: npm run check:docs
      - name: Package and run the extracted skill
        run: python tools/package_skill.py --check
      - name: Retain package and checksums
        uses: actions/upload-artifact@v4
        with:
          name: skill-node-${{ matrix.node }}-${{ matrix.os }}
          path: |
            dist/rea-pro-max-*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  owned-runtime:
    name: Owned browser, Java and native workloads / Ubuntu x64
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compare selected JAR members against the JVM
        run: RPM_JAVA_HOME="$JAVA_HOME" node --test tests/jar-profiles.test.mjs
      - name: Run real browser observations and verify persistent readback
        run: |
          export RPM_BROWSER_EXECUTABLE="$(command -v google-chrome)"
          test -x "$RPM_BROWSER_EXECUTABLE"
          node --test tests/runtime-web.test.mjs
          node skills/rea-pro-max/assets/labs/web-persistence/verify.mjs
      - name: Compile and verify the owned native reconstruction
        run: node skills/rea-pro-max/assets/labs/native-recovery/run.mjs --out "$RUNNER_TEMP/rpm-native"
      - uses: actions/upload-artifact@v4
        with:
          name: native-verification-ubuntu-x64
          path: ${{ runner.temp }}/rpm-native
          if-no-files-found: error
