name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolkit:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Keep source bytes identical across operating systems
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development tools without Electron runtime download
        run: npm ci --ignore-scripts
      - name: Run engine and CLI tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Check documentation and recorded data
        run: npm run check:docs
      - name: Package and run the extracted skill
        run: python tools/package_skill.py --check
      - name: Retain package and checksums
        uses: actions/upload-artifact@v4
        with:
          name: skill-node-${{ matrix.node }}-${{ matrix.os }}
          path: |
            dist/rea-pro-max-*.zip
            dist/SHA256SUMS
          if-no-files-found: error
